name: Keep Supabase alive

on:
  schedule:
    # 07:00 East Africa Time (UTC+3). GitHub can skip a scheduled run;
    # daily is well inside the 7-day free-tier pause window.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Postgres via keep_alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Add GitHub Actions secrets SUPABASE_URL and SUPABASE_ANON_KEY (Project Settings → API)."
            exit 1
          fi
          curl -fsS -X POST "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json"
          echo
